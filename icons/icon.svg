<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="256" cy="250" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8a44a" stop-opacity=".38"/>
      <stop offset=".45" stop-color="#b8712a" stop-opacity=".12"/>
      <stop offset="1" stop-color="#0c0a08" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3c27a"/>
      <stop offset="1" stop-color="#d88a35"/>
    </linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8a44a" stop-opacity=".30"/>
      <stop offset="1" stop-color="#e8a44a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#0c0a08"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- light falling below the shade -->
  <path d="M176 248 L336 248 L404 404 L108 404 Z" fill="url(#pool)"/>
  <!-- shade -->
  <path d="M206 132 L306 132 L344 248 L168 248 Z" fill="url(#shade)"/>
  <path d="M168 248 L344 248" stroke="#ffd9a0" stroke-width="5" stroke-linecap="round" opacity=".8"/>
  <!-- stem and base -->
  <rect x="249" y="248" width="14" height="120" rx="4" fill="#7a5530"/>
  <ellipse cx="256" cy="374" rx="64" ry="13" fill="#8c6236"/>
  <!-- table line -->
  <rect x="96" y="386" width="320" height="4" rx="2" fill="#3a2a1a"/>
</svg>
