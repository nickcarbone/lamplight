name: Build catalogue

# Rebuilds catalogue.json whenever the curated sources, vetting or scripts change.
# Run it by hand with "resolve" ticked to re-fetch archive.org metadata.
on:
  push:
    branches: [main]
    paths: ['data/sources.json', 'data/vetting.json', 'data/vetting-patches/**', 'scripts/**']
  workflow_dispatch:
    inputs:
      resolve:
        description: 'Re-fetch archive.org metadata for every entry'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: catalogue
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Merge review patches
        run: node scripts/merge-vetting.mjs
      - name: Build catalogue
        run: |
          if [ "${{ inputs.resolve }}" = "true" ]; then
            node scripts/build-catalogue.mjs --resolve --strict
          else
            node scripts/build-catalogue.mjs --strict
          fi
      - name: Commit if changed
        run: |
          git config user.name "lamplight-bot"
          git config user.email "lamplight-bot@users.noreply.github.com"
          git add -A data catalogue.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Rebuild catalogue"
          git push
